[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
network = "monad"
chain_id = 10143
bytecode_hash = "none"
use_literal_content = true

[rpc_endpoints]
monad-testnet = "https://testnet-rpc.monad.xyz"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
